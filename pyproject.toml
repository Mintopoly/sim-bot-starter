[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simbot"
version = "0.1.0"
description = "Python client + reference bots for the Children of Titan Sim API."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Children of Titan" }]
requires-python = ">=3.10"
keywords = ["mmo", "bot", "agent", "reinforcement-learning", "benchmark", "multi-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
rl = ["numpy>=1.26"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://www.childrenoftitan.com"
Documentation = "https://www.childrenoftitan.com/sim/docs"
Repository = "https://github.com/children-of-titan/sim-bot-starter"
Issues = "https://github.com/children-of-titan/sim-bot-starter/issues"

[tool.setuptools]
packages = ["simbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true
